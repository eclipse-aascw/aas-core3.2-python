[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aas-core3.2-python-dev"
version = "0.0.1"
description = "Develop aas-core3.2-python."
requires-python = ">=3.8"

dependencies = [
    "black==26.10.1",
    "coverage>=6.5.0,<7",
    "mypy==2.4.0",
    "pyinstaller>=5,<6",
    "ruff==0.17.2",
    "tomli; python_version<'3.11'",
    "twine",
    "requests==2.32.4",
    "types-requests==2.32.4.20250913",
    "aas-core-codegen==0.0.27rc4"
]

[tool.setuptools]
packages = [
    "tests",
    "dev_scripts",
    "continuous_integration"
]

# NOTE (mristin):
# We put the configuration of mypy and ruff in separate files as it is a nightmare
# to configure them with pyproject.toml not living in the current working directory
# which is the repository root.
