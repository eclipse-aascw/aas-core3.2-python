[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aas-core3.2-python-dev"
version = "0.0.1"
description = "Develop aas-core3.2-python."
requires-python = ">=3.8"

dependencies = [
    # NOTE (aaronzi, 2026-11-05):
    # black, mypy and aas-core-codegen require Python 3.10 or newer, so we skip
    # them on 3.9, where we only run the tests.
    "black==26.10.1; python_version>='3.10'",
    "coverage>=6.5.0,<7",
    "mypy==2.4.0; python_version>='3.10'",
    "pyinstaller>=5,<6",
    "ruff==0.17.2",
    "tomli; python_version<'3.11'",
    "twine",
    "requests==2.32.4",
    "types-requests==2.32.4.20250913",
    "aas-core-codegen==0.0.27rc5; python_version>='3.10'"
]

[tool.setuptools]
packages = [
    "tests",
    "dev_scripts",
    "continuous_integration"
]

# NOTE (mristin):
# We put the configuration of mypy and ruff in separate files as it is a nightmare
# to configure them with pyproject.toml not living in the current working directory
# which is the repository root.
